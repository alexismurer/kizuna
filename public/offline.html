<head>

<title>Offline</title>

  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0b0f; color: #ededf0; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
